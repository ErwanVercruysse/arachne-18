<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARACHNE login</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%236aa7ff%22/%3E%3Cpath d=%22M16 16L4 6M16 16L2 16M16 16L4 26M16 16L28 6M16 16L30 16M16 16L28 26%22 stroke=%22%236aa7ff%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root{--bg:#111517;--panel:#1a1f21;--panel2:#20272a;--line:#2a3235;--line2:#364044;--text:#e6ebe9;--dim:#8a9692;--faint:#5d6865;--acc:#6aa7ff;--bad:#ef6b5b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 20%,#1d2528 0%,#111517 65%) fixed;color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px #0008}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo svg{width:38px;height:38px}
h1{font-size:19px;letter-spacing:.3em;margin:0}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
button{font:inherit;width:100%;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px;cursor:pointer}
button:hover{border-color:#48545a}button:active{transform:translateY(1px)}
button.primary{background:var(--acc);border-color:var(--acc);color:#0b1320;font-weight:600}
.guest small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:20px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:12px}
input{display:block;width:100%;margin-top:5px;font:15px var(--mono);color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:11px 12px}
input:focus{outline:none;border-color:var(--acc)}
#err{color:var(--bad);font-size:13px;min-height:18px;margin:-2px 0 10px}
.foot{color:var(--faint);font-size:11px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="#6aa7ff"/><path d="M16 16L4 6M16 16L2 16M16 16L4 26M16 16L28 6M16 16L30 16M16 16L28 26" stroke="#6aa7ff" stroke-width="2.5" stroke-linecap="round"/></svg>
      <h1>ARACHNE</h1>
    </div>
    <p class="sub">Live twin, simulatie en cockpit van de hexapod.</p>
    <button class="guest" id="guest">Doorgaan als gast<small>kijken naar de robot en spelen met de simulatie</small></button>
    <div class="or">of inloggen</div>
    <form id="f">
      <label>Gebruiker<input id="u" autocomplete="username" autocapitalize="off" autocorrect="off" required></label>
      <label>Wachtwoord<input id="p" type="password" autocomplete="current-password" required></label>
      <div id="err"></div>
      <button class="primary" type="submit">Inloggen</button>
    </form>
    <div class="foot">Ingelogd mag je ook de echte robot bewegen.</div>
  </div>
</main>
<script>
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
document.querySelector('#guest').onclick = () => { try { localStorage.setItem('arachneGuest', '1'); } catch {} location.href = next; };
document.querySelector('#f').onsubmit = async e => {
  e.preventDefault(); const err = document.querySelector('#err'); err.textContent = '';
  const r = await fetch('/login', {method: 'POST', body: JSON.stringify({user: document.querySelector('#u').value.trim(), password: document.querySelector('#p').value})}).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (r && r.ok) { try { localStorage.setItem('arachneGuest', '1'); } catch {} location.href = next; }
  else err.textContent = j.error || 'geen verbinding';
};
</script>
</body>
</html>
